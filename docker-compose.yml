services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ibrary
      POSTGRES_PASSWORD: ibrary
      POSTGRES_DB: ibrary
    ports:
      - "5433:5432"
    volumes:
      - ibrary_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibrary -d ibrary"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ibrary_pg:
